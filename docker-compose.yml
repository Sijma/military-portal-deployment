networks:
  public:
  internal:
    internal: true

services:
  apisix:
    build:
      context: apisix
    ports:
      - "${PORTAL_HTTP_PORT:-9080}:9080"
    environment:
      APISIX_OIDC_CLIENT_SECRET: "${APISIX_OIDC_CLIENT_SECRET}"
      APISIX_SESSION_SECRET: "${APISIX_SESSION_SECRET}"
      KEYCLOAK_HOST: "keycloak"
      BROWSER_BASE_URL: "${BROWSER_BASE_URL}"

      CITIZEN_HOST: "citizen-service"
      OFFICER_HOST: "officer-service"
      ADMIN_HOST: "admin-service"
      FRONTEND_HOST: "frontend"
      MAIL_HOST: "mailhog"
    networks:
      - public
      - internal
    restart: unless-stopped
    depends_on:
      - keycloak
      - citizen-service
      - officer-service
      - admin-service
      - frontend

  keycloak:
    build: keycloak
    command: start --import-realm --hostname-backchannel-dynamic=true
    networks:
      - internal
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      APISIX_OIDC_CLIENT_SECRET: "${APISIX_OIDC_CLIENT_SECRET}"

      BROWSER_BASE_URL: "${BROWSER_BASE_URL}"
      KEYCLOAK_SSL_REQUIRED: "${KEYCLOAK_SSL_REQUIRED}"
      CITIZEN_DEMO_PASSWORD: "${CITIZEN_DEMO_PASSWORD}"
      OFFICER_DEMO_PASSWORD: "${OFFICER_DEMO_PASSWORD}"
      ADMIN_DEMO_PASSWORD: "${ADMIN_DEMO_PASSWORD}"

      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}"
      KC_DB_USERNAME: "${KEYCLOAK_DB_USER}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "${BROWSER_BASE_URL}"
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: "xforwarded"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build: postgres
    networks:
      - internal
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_ADMIN_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD}"
      PORTAL_DB_USER: "${PORTAL_DB_USER}"
      PORTAL_DB_PASSWORD: "${PORTAL_DB_PASSWORD}"
      KEYCLOAK_DB_NAME: "${KEYCLOAK_DB_NAME}"
      KEYCLOAK_DB_USER: "${KEYCLOAK_DB_USER}"
      KEYCLOAK_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    command: ["-ui-web-path", "mail"] # makes the ui available on /mail.
    networks:
      - internal
    restart: unless-stopped

  # Same image deployed 3 times; the instance selects the routes and listen port.
  citizen-service:
    # When --build is not used, this fetches the published github image. Tag defaults to 'latest' if none is provided.
    image: "${PORTAL_IMAGE_PREFIX:-ghcr.io/sijma}/military-portal-backend:${PORTAL_IMAGE_TAG:-latest}"
    command: ["--service-instance", "citizen:8081", "--bind-host", "0.0.0.0"]
    networks:
      - internal
    environment:
      DATABASE_URL: "postgres://postgres:5432"
      PGUSER: "${PORTAL_DB_USER}"
      PGPASSWORD: "${PORTAL_DB_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB}"
      MAIL_HOST: "mailhog"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_FROM: "${MAIL_FROM}"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

  officer-service:
    image: "${PORTAL_IMAGE_PREFIX:-ghcr.io/sijma}/military-portal-backend:${PORTAL_IMAGE_TAG:-latest}"
    command: ["--service-instance", "officer:8082", "--bind-host", "0.0.0.0"]
    networks:
      - internal
    environment:
      DATABASE_URL: "postgres://postgres:5432"
      PGUSER: "${PORTAL_DB_USER}"
      PGPASSWORD: "${PORTAL_DB_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB}"
      MAIL_HOST: "mailhog"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_FROM: "${MAIL_FROM}"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

  admin-service:
    image: "${PORTAL_IMAGE_PREFIX:-ghcr.io/sijma}/military-portal-backend:${PORTAL_IMAGE_TAG:-latest}"
    command: ["--service-instance", "admin:8083", "--bind-host", "0.0.0.0"]
    networks:
      - internal
    environment:
      DATABASE_URL: "postgres://postgres:5432"
      PGUSER: "${PORTAL_DB_USER}"
      PGPASSWORD: "${PORTAL_DB_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB}"
      MAIL_HOST: "mailhog"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_FROM: "${MAIL_FROM}"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: "${PORTAL_IMAGE_PREFIX:-ghcr.io/sijma}/military-portal-frontend:${PORTAL_IMAGE_TAG:-latest}"
    networks:
      - internal
    restart: unless-stopped

volumes:
  pgdata:
