# We need two oidc definitions: 1 to handle the entry point and another to handle internal api calls,
# as each should handle bad auth (401 instead of redirect to keycloak for internal api calls)
plugin_configs:
  - id: oidc-browser
    plugins:
      openid-connect:
        client_id: "apisix"
        client_secret: "$ENV://APISIX_OIDC_CLIENT_SECRET"
        discovery: "http://${{KEYCLOAK_HOST}}:8080/realms/military-portal/.well-known/openid-configuration"
        token_endpoint: "http://${{KEYCLOAK_HOST}}:8080/realms/military-portal/protocol/openid-connect/token"
        userinfo_endpoint: "http://${{KEYCLOAK_HOST}}:8080/realms/military-portal/protocol/openid-connect/userinfo"
        scope: "openid profile email roles"
        bearer_only: false
        use_pkce: true
        redirect_uri: "${{BROWSER_BASE_URL}}/callback"
        logout_path: "/logout"
        post_logout_redirect_uri: "${{BROWSER_BASE_URL}}/"
        set_userinfo_header: true
        session:
          secret: "$ENV://APISIX_SESSION_SECRET"
        unauth_action: "auth"

  - id: oidc-api
    plugins:
      openid-connect:
        client_id: "apisix"
        client_secret: "$ENV://APISIX_OIDC_CLIENT_SECRET"
        discovery: "http://${{KEYCLOAK_HOST}}:8080/realms/military-portal/.well-known/openid-configuration"
        token_endpoint: "http://${{KEYCLOAK_HOST}}:8080/realms/military-portal/protocol/openid-connect/token"
        userinfo_endpoint: "http://${{KEYCLOAK_HOST}}:8080/realms/military-portal/protocol/openid-connect/userinfo"
        scope: "openid profile email roles"
        bearer_only: false
        use_pkce: true
        redirect_uri: "${{BROWSER_BASE_URL}}/callback"
        logout_path: "/logout"
        post_logout_redirect_uri: "${{BROWSER_BASE_URL}}/"
        set_userinfo_header: true
        session:
          secret: "$ENV://APISIX_SESSION_SECRET"
        unauth_action: "deny"

routes:
  - id: api-me
    uri: "/api/me"
    priority: 200
    plugin_config_id: oidc-api
    plugins:
      app-auth:
        role: any
        respond_with_identity: true

  - id: api
    uris: ["/api", "/api/*"]
    priority: 100
    plugin_config_id: oidc-api

    plugins:
      app-auth:
        role: any

      # Removes the '/api' uri prefix that goes into the backend.
      proxy-rewrite:
        regex_uri: ["^/api/?(.*)", "/${1}"]

      traffic-split:
        rules:
          - match:
              - vars:
                  - ["http_x-user-role", "==", "citizen"]
            weighted_upstreams:
              - upstream:
                  type: roundrobin
                  nodes:
                    "${{CITIZEN_HOST}}:8081": 1
                weight: 1

          - match:
              - vars:
                  - ["http_x-user-role", "==", "officer"]
            weighted_upstreams:
              - upstream:
                  type: roundrobin
                  nodes:
                    "${{OFFICER_HOST}}:8082": 1
                weight: 1

          - match:
              - vars:
                  - ["http_x-user-role", "==", "admin"]
            weighted_upstreams:
              - upstream:
                  type: roundrobin
                  nodes:
                    "${{ADMIN_HOST}}:8083": 1
                weight: 1

    upstream:
      type: roundrobin
      nodes:
        "${{CITIZEN_HOST}}:8081": 1

  # browser routing to keycloak's necessary paths and resources
  - id: keycloak
    uris: ["/realms/*", "/resources/*", "/js/*"]
    priority: 150

    upstream:
      type: roundrobin
      nodes:
        "${{KEYCLOAK_HOST}}:8080": 1

  # Keycloak handles auth for its own admin console.
  - id: keycloak-admin
    uris: ["/admin", "/admin/*"]
    priority: 150

    upstream:
      type: roundrobin
      nodes:
        "${{KEYCLOAK_HOST}}:8080": 1

  - id: mailhog
    uris: ["/mail", "/mail/*"]
    priority: 150

    upstream:
      type: roundrobin
      nodes:
        "${{MAIL_HOST}}:8025": 1

  - id: spa
    uri: "/*"
    priority: 1
    plugin_config_id: oidc-browser

    upstream:
      type: roundrobin
      nodes:
        "${{FRONTEND_HOST}}:80": 1
#END
