---
- name: Install MailHog
  get_url:
    url: "https://github.com/mailhog/MailHog/releases/download/v{{ mailhog_version }}/MailHog_linux_amd64"
    dest: /usr/local/bin/mailhog
    checksum: "{{ mailhog_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart MailHog

- name: Install the MailHog systemd service
  template:
    src: "{{ portal_template_dir }}/mailhog.service.j2"
    dest: /etc/systemd/system/mailhog.service
    owner: root
    group: root
  notify: Restart MailHog

- name: Enable and start MailHog
  systemd_service:
    name: mailhog
    state: started
    enabled: true
    daemon_reload: true

- name: Apply MailHog changes before checking readiness
  meta: flush_handlers

- name: Wait for MailHog readiness
  uri:
    url: http://127.0.0.1:8025/mail/
    status_code: 200
  register: mailhog_health
  retries: 10
  delay: 2
  until: mailhog_health.status == 200
