---
- name: Create apt keyring dir
  file:
    path: /etc/apt/keyrings
    state: directory

- name: Install nginx repo requirements
  apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Download nginx signing key
  get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: /etc/apt/keyrings/nginx.asc

- name: Add nginx repo
  ansible.builtin.deb822_repository:
    name: nginx
    types: [deb]
    uris: https://nginx.org/packages/mainline/debian
    suites: bookworm
    components: [nginx]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/nginx.asc
    install_python_debian: true
    state: present

- name: Increase nginx.org repo priority
  copy:
    dest: /etc/apt/preferences.d/99nginx
    content: |
      Package: nginx nginx-module-acme
      Pin: origin nginx.org
      Pin-Priority: 900

- name: Refresh APT cache after adding the nginx repository
  apt:
    update_cache: true

- name: Install nginx and acme module
  apt:
    name:
      - nginx
      - nginx-module-acme
    state: present

- name: Install the nginx configuration
  copy:
    src: "{{ portal_project_root }}/ansible/files/nginx.conf"
    dest: /etc/nginx/nginx.conf
  notify: Restart nginx

- name: Create the frontend release cache
  file:
    path: /var/cache/military-portal
    state: directory
    owner: root
    group: root

- name: Download the compressed frontend release
  get_url:
    url: "{{ frontend_release_url }}"
    dest: /var/cache/military-portal/frontend-dist.tar.gz
    checksum: "{{ frontend_release_checksum | default(omit, true) }}"
    owner: root
    group: root
  register: frontend_archive

- name: Create the frontend web root
  file:
    path: /var/www/portal
    state: directory
    owner: root
    group: root

- name: Check if the frontend is already installed
  stat:
    path: /var/www/portal/index.html
  register: frontend_index

- name: Unpack the frontend release
  unarchive:
    src: /var/cache/military-portal/frontend-dist.tar.gz
    dest: /var/www/portal
    remote_src: true
    owner: root
    group: root
  when: frontend_archive.changed or not frontend_index.stat.exists

- name: Copy loopback nginx config
  copy:
    src: "{{ portal_project_root }}/ansible/files/nginx-portal.conf"
    dest: /etc/nginx/conf.d/default.conf
  notify: Restart nginx

- name: Enable and start nginx
  service:
    name: nginx
    state: started
    enabled: true
